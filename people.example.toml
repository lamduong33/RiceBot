# Copy to people.toml. People RiceBot knows, keyed by Discord user ID, so it
# recognises them even after a nickname change.
#
# Get an ID: Discord Settings > Advanced > enable Developer Mode, then
# right-click a user > Copy User ID.
#
# `name` is what RiceBot calls them. Everyone's `notes` are sent to the model
# with every message, so RiceBot knows about people even when they aren't
# tagged. Keep them short.

[[person]]
id = 123456789012345678
name = "Alex"
notes = ["always asks what to eat", "plays support in every game"]

[[person]]
id = 234567890123456789
name = "Jordan"
notes = ["thinks pineapple belongs on rice"]
