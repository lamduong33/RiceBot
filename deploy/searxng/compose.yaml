# Private SearXNG instance for RiceBot's web search.
#
# Listens on 127.0.0.1 only: never expose it to the internet or your network.
# Start:   docker compose up -d        (from this folder)
# Update:  docker compose pull && docker compose up -d
# Test:    curl -s '127.0.0.1:8888/search?q=rice&format=json' | head -c 300
#
# Needs a secret key in .env next to this file (git-ignored):
#   echo "SEARXNG_SECRET=$(openssl rand -hex 32)" > .env

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET in deploy/searxng/.env}
    # Least privilege: no extra Linux capabilities, no privilege escalation.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
