# SearXNG settings for RiceBot. Only differences from the defaults are listed.
# The secret key comes from SEARXNG_SECRET (see compose.yaml).
use_default_settings: true

general:
  instance_name: "RiceBot search"

server:
  # Private instance used only by the bot on this machine, so the rate limiter
  # (which needs Valkey/Redis) isn't needed.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  # RiceBot reads results through the JSON API, which is off by default.
  formats:
    - html
    - json
